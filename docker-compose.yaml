services:
  test-runner:
    build: .

    command: . .
    
    # Resource limits (works with regular Compose)
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    
    # Security
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    
    # Volumes
    volumes:
      - ${OUTPUT_DIR}:/testcases/usercode:ro
      - ${TESTCASES_DIR}:/testcases/testcases:ro
    
    # Process limits
    ulimits:
      nproc: 10
